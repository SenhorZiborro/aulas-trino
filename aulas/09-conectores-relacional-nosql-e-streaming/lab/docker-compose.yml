name: trino-aula09

# Um lab, três famílias de fonte — é o ponto da aula:
#
#   postgres  -> fonte RELACIONAL, com schema rígido e SQL próprio
#   mongo     -> fonte NÃO RELACIONAL, sem schema declarado
#   kafka     -> fonte de STREAM, append-only e sem atualização
#
# e o MinIO no fim, para materializar em Parquet quando federar deixa de
# compensar.
#
# SOBRE A IMAGEM DO MinIO (medido em 2026-10-08): `minio/minio` no Docker Hub
# deixou de aceitar pull anônimo e `quay.io/minio/minio` responde 401. A imagem
# arquivada da Bitnami ainda é pública, é o mesmo MinIO, e cria o bucket sozinha
# via MINIO_DEFAULT_BUCKETS.

services:
  trino:
    image: trinodb/trino:483
    container_name: trino-aula09
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo
      - kafka
      - kafka-init
      - minio
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      # Diretório com os JSON de descrição de tabela do Kafka
      - ./etc/kafka:/etc/trino/kafka:ro

  postgres:
    image: postgres:16
    container_name: postgres-aula09
    environment:
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
      POSTGRES_DB: vendas
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    container_name: mongo-aula09
    environment:
      MONGO_INITDB_ROOT_USERNAME: trino
      MONGO_INITDB_ROOT_PASSWORD: trino
      MONGO_INITDB_DATABASE: loja
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-aula09
    ports:
      - "9092:9092"
    environment:
      # KRaft em modo COMBINADO: o mesmo processo acumula broker e controller,
      # e o quorum aponta para ele mesmo. Um container, o mais leve possível.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Semeia o topico na subida, do mesmo jeito que o Postgres e o Mongo se
  # semeiam sozinhos: cria `pedido` com 3 particoes e produz as mensagens.
  # As com chave sao o que faz as tres particoes se preencherem -- sem chave o
  # produtor usa o sticky partitioner e manda o lote todo para uma so.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init-aula09
    depends_on:
      - kafka
    volumes:
      - ./eventos.ndjson:/data/eventos.ndjson:ro
      - ./eventos-com-chave.ndjson:/data/eventos-com-chave.ndjson:ro
      - ./mensagem-corrompida.txt:/data/mensagem-corrompida.txt:ro
    entrypoint: >
      sh -c "
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pedido --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:9092 --topic pedido < /data/eventos.ndjson;
        /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:9092 --topic pedido --property parse.key=true --property key.separator=: < /data/eventos-com-chave.ndjson;
        /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:9092 --topic pedido < /data/mensagem-corrompida.txt;
        echo 'topico pedido criado e carregado';
      "

  minio:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    container_name: minio-aula09
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DEFAULT_BUCKETS: lakehouse
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web (minio / minio123)
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  minio-data:
