connector.name=hive

# Metastore de ARQUIVO: o metadado vai para o proprio bucket, sem servico de
# metastore nem banco. Suficiente para laboratorio; em producao se usa Thrift,
# Glue ou REST.
hive.metastore=file
hive.metastore.catalog.dir=s3://lakehouse/warehouse

# Sistema de arquivos nativo S3
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123

# Formato default das tabelas criadas neste catalogo
hive.storage-format=PARQUET
