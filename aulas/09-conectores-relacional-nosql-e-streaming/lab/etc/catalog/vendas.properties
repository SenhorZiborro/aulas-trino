connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/vendas
connection-user=trino
connection-password=trino

# Cache de metadados: sem isso, cada query consulta o catalogo remoto.
metadata.cache-ttl=30s

# Arrays do Postgres: DISABLED (default) faria a coluna SUMIR.
postgresql.array-mapping=AS_ARRAY

# Tipo nao suportado: IGNORE (default) tambem faz a coluna sumir.
unsupported-type-handling=CONVERT_TO_VARCHAR

# Pushdown de join, ligado por padrao. AUTOMATIC = decide por custo.
join-pushdown.enabled=true
join-pushdown.strategy=AUTOMATIC

# Auditoria: o DBA da origem passa a ver quem originou cada query.
# ATENCAO ao formato: so letras, digitos, underscores, virgulas, espacos,
# sinais de igual e os tokens predefinidos. Dois-pontos ou hifen fazem o
# servidor NAO INICIAR:
#   Invalid configuration property with prefix '': Incorrect format ...
query.comment-format=trino_query_id=$QUERY_ID user=$USER source=$SOURCE
