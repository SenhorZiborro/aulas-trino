connector.name=mongodb
mongodb.connection-url=mongodb://trino:trino@mongo:27017/

# Colecao onde o Trino guarda o schema inferido/declarado (default: _schema)
mongodb.schema-collection=_schema

# Empurra a selecao de campos para o Mongo: evita trazer o documento inteiro
mongodb.projection-pushdown-enabled=true

# Nomes de colecao com maiusculas.
# ATENCAO: no MongoDB a propriedade e PREFIXADA. Usar o nome dos conectores
# JDBC (case-insensitive-name-matching) impede o servidor de iniciar:
#   Configuration property 'case-insensitive-name-matching' was not used
mongodb.case-insensitive-name-matching=true
