# Catalogo de LEITURA do topico `pedido`.
#
# POR QUE EXISTEM DOIS CATALOGOS PARA O MESMO TOPICO
# O conector Kafka acrescenta 9 colunas INTERNAS a cada tabela (_partition_id,
# _partition_offset, _timestamp, _message, _message_corrupt, _headers,
# _message_length, _key, _key_corrupt, _key_length). Elas sao a ferramenta de
# depuracao do stream -- mas o caminho de ESCRITA do conector nao as aceita na
# lista de colunas da tabela, e o INSERT falha com "Unexpected columns!".
# Como isso e decidido por uma propriedade de CATALOGO, e nao de sessao, o
# unico jeito de ter as duas coisas e mapear o mesmo topico duas vezes:
#
#   stream    (este)  -> hide-internal-columns=false -> as internas aparecem no
#                        DESCRIBE e no SELECT *; serve para LER e depurar
#   stream_w          -> hide-internal-columns=true  -> as internas somem da
#                        listagem; e o unico que aceita INSERT
#
# Nao e estilo: e limitacao do conector.
connector.name=kafka
kafka.nodes=kafka:9092
kafka.default-schema=default
kafka.table-description-supplier=FILE
kafka.table-description-dir=/etc/trino/kafka
kafka.table-names=default.pedido
kafka.hide-internal-columns=false
