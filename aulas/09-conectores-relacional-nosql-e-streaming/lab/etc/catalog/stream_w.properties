# Catalogo de ESCRITA do mesmo topico `pedido` -- o sufixo _w e de "write".
#
# Identico ao `stream`, com UMA diferenca: hide-internal-columns=true. Com as
# colunas internas escondidas da listagem, o caminho de escrita aceita o
# INSERT. Elas continuam consultaveis se voce as pedir pelo NOME; o que muda e
# so o que aparece no DESCRIBE e no SELECT *.
#
# O motivo completo esta no comentario de stream.properties.
connector.name=kafka
kafka.nodes=kafka:9092
kafka.default-schema=default
kafka.table-description-supplier=FILE
kafka.table-description-dir=/etc/trino/kafka
kafka.table-names=default.pedido
kafka.hide-internal-columns=true
