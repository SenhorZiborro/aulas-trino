# WORKER. Os dois workers usam este mesmo arquivo: o que distingue um do outro
# e o node.id, que cada container gera no proprio diretorio de dados.
coordinator=false

http-server.http.port=8080
discovery.uri=http://trino:8080

# O worker publica o SEU /metrics, independente do coordinator -- e por isso
# que o Prometheus precisa coletar de todos os nos, nao so do coordinator.
metrics.jmx-object-names=java.lang:type=Memory|java.lang:type=GarbageCollector,name=*
