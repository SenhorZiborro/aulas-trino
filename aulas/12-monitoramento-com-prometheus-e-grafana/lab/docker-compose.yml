name: trino-aula12

services:
  trino:
    image: trinodb/trino:483
    container_name: trino-aula12
    mem_limit: 2g
    ports:
      - "8080:8080"
    depends_on:
      - minio
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      - ./etc/config.properties:/etc/trino/config.properties:ro

  trino-worker-1:
    image: trinodb/trino:483
    container_name: trino-worker-1-aula12
    mem_limit: 2g
    depends_on:
      - trino
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      - ./etc-worker/config.properties:/etc/trino/config.properties:ro

  trino-worker-2:
    image: trinodb/trino:483
    container_name: trino-worker-2-aula12
    mem_limit: 2g
    depends_on:
      - trino
    volumes:
      - ./etc/catalog:/etc/trino/catalog:ro
      - ./etc-worker/config.properties:/etc/trino/config.properties:ro

  minio:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    container_name: minio-aula12
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DEFAULT_BUCKETS: lakehouse
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web (minio / minio123)
    volumes:
      - minio-data:/bitnami/minio/data

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus-aula12
    depends_on:
      - trino
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/regras.yml:/etc/prometheus/regras.yml:ro
      - ./prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana-aula12
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Acesso anônimo como leitor: a turma abre o dashboard sem login. Em
      # produção isso não existe.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  carga:
    image: trinodb/trino:483
    container_name: carga-aula12
    depends_on:
      - trino
      - trino-worker-1
      - trino-worker-2
    volumes:
      - ./carga/consultas.sh:/consultas.sh:ro
    entrypoint: ["/bin/sh", "/consultas.sh"]

volumes:
  minio-data:
