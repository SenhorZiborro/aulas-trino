connector.name=hive

# Metastore de ARQUIVO: o metadado da tabela e gravado como arquivo no proprio
# bucket, sem subir servico de metastore (ver aula 13).
hive.metastore=file
hive.metastore.catalog.dir=s3://lakehouse/warehouse

# Sistema de arquivos NATIVO S3 (ver aula 19)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123

hive.storage-format=PARQUET
