connector.name=prometheus

# A OUTRA DIRECAO: aqui o Trino LE o Prometheus. O Prometheus coleta as
# metricas do Trino, e este catalogo devolve essas mesmas series como tabela,
# para consultar com SQL. Uma fonte, um catalogo.
prometheus.uri=http://prometheus:9090

# Janela total que uma consulta cobre, e o tamanho de cada pedaco dela. O
# default (21d / 1d) e grande demais para um lab que vive meia hora: com 1h/5m
# a consulta volta rapido e ainda cobre a aula inteira.
prometheus.max.query.range.duration=1h
prometheus.query.chunk.size.duration=5m
prometheus.cache.ttl=10s
