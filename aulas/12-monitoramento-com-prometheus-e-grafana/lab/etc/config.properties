# COORDINATOR
coordinator=true

# O coordinator NAO recebe trabalho: assim o split vai para os workers e as
# metricas de cada papel ficam distinguiveis no dashboard.
node-scheduler.include-coordinator=false

http-server.http.port=8080
discovery.uri=http://trino:8080

# Acrescenta ao /metrics os MBeans da JVM que o Trino nao expoe por conta
# propria: memoria e coletores de lixo. Varios object names se separam com |
# (ver aula 18).
metrics.jmx-object-names=java.lang:type=Memory|java.lang:type=GarbageCollector,name=*
