name: trino-aula01

services:
  trino:
    image: trinodb/trino:483
    container_name: trino-aula01
    ports:
      - "8080:8080"
    volumes:
      # Monta o diretório de configuração INTEIRO.
      # Por isso etc/ precisa conter config.properties, node.properties,
      # jvm.config e log.properties — não há merge com o default da imagem.
      - ./etc:/etc/trino:ro
    # A imagem oficial já define o próprio HEALTHCHECK.
    # Acompanhe com: docker compose ps
