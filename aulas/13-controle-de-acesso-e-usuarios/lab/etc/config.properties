coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# AUTENTICACAO por arquivo de senha. Senha so trafega sobre TLS: o CLI recusa
# mandar usuario e senha em HTTP puro, entao o lab sobe HTTPS com um
# certificado autoassinado (etc/trino.pem).
http-server.authentication.type=PASSWORD
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/trino.pem

# Ligar autenticacao obriga um segredo compartilhado entre os nos do cluster,
# mesmo em no unico: sem ele o Trino nao sobe.
internal-communication.shared-secret=segredo-do-lab-13
