connector.name=hive

# Metastore de ARQUIVO: o metadado das tabelas e gravado como arquivo no
# proprio bucket, em s3://lakehouse/metastore. Serve para aula e laboratorio;
# em producao se usa Thrift, Glue ou REST (aulas 23 em diante).
hive.metastore=file
hive.metastore.catalog.dir=s3://lakehouse/warehouse

# Sistema de arquivos NATIVO S3 (detalhado na aula 22)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123

# Formato default das tabelas criadas sem WITH (format = ...)
hive.storage-format=PARQUET
