connector.name=iceberg
# ATENCAO: no conector Iceberg NAO existe 'hive.metastore' — quem escolhe o
# tipo de catalogo e o iceberg.catalog.type. Deixar 'hive.metastore=thrift'
# aqui impede o servidor de subir:
#   Configuration property 'hive.metastore' was not used.
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://metastore:9083

# Defaults do Iceberg (bem mais modernos que os do Hive)
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
iceberg.target-max-file-size=1GB

# Guardas de seguranca para as operacoes destrutivas de manutencao
iceberg.expire-snapshots.min-retention=1m
iceberg.remove-orphan-files.min-retention=1m

# Necessario para a procedure register_table
iceberg.register-table-procedure.enabled=true

fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minio
s3.aws-secret-key=minio123
